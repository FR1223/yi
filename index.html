<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>食材管家 - 食品保质期管理</title>
    <style>
        :root {
            --bg: #f7f6f3;
            --card: #ffffff;
            --primary: #3d7a5f;
            --primary-dark: #2d5d47;
            --primary-light: #e8f3ee;
            --primary-50: #f0f7f3;
            --text: #1f2937;
            --text-secondary: #6b7280;
            --text-muted: #9ca3af;
            --border: #e5e7eb;
            --border-light: #f0f0ed;
            --danger: #dc2626;
            --danger-bg: #fef2f2;
            --danger-border: #fecaca;
            --warning: #ea580c;
            --warning-bg: #fff7ed;
            --warning-border: #fed7aa;
            --caution: #ca8a04;
            --caution-bg: #fefce8;
            --caution-border: #fef08a;
            --success: #16a34a;
            --success-bg: #f0fdf4;
            --success-border: #bbf7d0;
            --info: #3b82f6;
            --info-bg: #eff6ff;
            --info-border: #bfdbfe;
            --shadow-sm: 0 1px 3px rgba(0, 0, 0, 0.06);
            --shadow-md: 0 4px 12px rgba(0, 0, 0, 0.08);
            --shadow-lg: 0 8px 30px rgba(0, 0, 0, 0.12);
            --radius: 12px;
            --radius-sm: 8px;
            --radius-lg: 16px;
            --transition: 0.25s cubic-bezier(0.4, 0, 0.2, 1);
            --font: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: var(--font);
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            line-height: 1.5;
            -webkit-font-smoothing: antialiased;
            -webkit-tap-highlight-color: transparent;
        }

        .navbar {
            background: var(--card);
            border-bottom: 1px solid var(--border);
            padding: 0 32px;
            height: 64px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            position: sticky;
            top: 0;
            z-index: 100;
            backdrop-filter: blur(12px);
            background: rgba(255, 255, 255, 0.92);
        }
        .navbar-brand {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 1.25rem;
            font-weight: 700;
            color: var(--primary-dark);
            letter-spacing: -0.3px;
        }
        .navbar-brand svg {
            width: 28px;
            height: 28px;
            color: var(--primary);
        }
        .navbar-actions {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .btn-icon {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 38px;
            height: 38px;
            border-radius: var(--radius-sm);
            border: 1px solid var(--border);
            background: var(--card);
            cursor: pointer;
            transition: var(--transition);
            color: var(--text-secondary);
            position: relative;
        }
        .btn-icon:hover {
            border-color: var(--primary);
            color: var(--primary);
            background: var(--primary-50);
            transform: translateY(-1px);
        }
        .btn-icon.active {
            border-color: var(--primary);
            color: var(--primary);
            background: var(--primary-50);
        }
        .btn-icon svg {
            width: 18px;
            height: 18px;
        }
        .btn-icon .dot-indicator {
            position: absolute;
            top: -4px;
            right: -4px;
            width: 10px;
            height: 10px;
            background: var(--danger);
            border-radius: 50%;
            border: 2px solid var(--card);
            display: none;
        }
        .btn-icon .dot-indicator.show {
            display: block;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 24px 24px 48px;
        }

        .stats-row {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 16px;
            margin-bottom: 20px;
        }
        .stat-card {
            background: var(--card);
            border-radius: var(--radius);
            padding: 18px 20px;
            box-shadow: var(--shadow-sm);
            border: 1px solid var(--border-light);
            transition: var(--transition);
            display: flex;
            align-items: center;
            gap: 14px;
            cursor: pointer;
        }
        .stat-card:hover {
            box-shadow: var(--shadow-md);
            transform: translateY(-2px);
        }
        .stat-icon {
            width: 44px;
            height: 44px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }
        .stat-icon svg { width: 22px; height: 22px; }
        .stat-icon.green { background: var(--success-bg); color: var(--success); }
        .stat-icon.blue { background: var(--info-bg); color: var(--info); }
        .stat-icon.orange { background: var(--warning-bg); color: var(--warning); }
        .stat-icon.red { background: var(--danger-bg); color: var(--danger); }
        .stat-info h3 { font-size: 1.75rem; font-weight: 700; line-height: 1.2; letter-spacing: -0.5px; }
        .stat-info p { font-size: 0.82rem; color: var(--text-secondary); margin-top: 2px; }

        .alert-banner {
            display: none;
            border-radius: var(--radius);
            padding: 14px 18px;
            margin-bottom: 20px;
            align-items: center;
            gap: 12px;
            font-size: 0.9rem;
            font-weight: 500;
            animation: slideDown 0.35s ease;
        }
        .alert-banner.show { display: flex; }
        .alert-banner.danger { background: var(--danger-bg); border: 1px solid var(--danger-border); color: var(--danger); }
        .alert-banner.warning { background: var(--warning-bg); border: 1px solid var(--warning-border); color: var(--warning); }
        .alert-banner.caution { background: var(--caution-bg); border: 1px solid var(--caution-border); color: #a16207; }
        .alert-banner svg { width: 20px; height: 20px; flex-shrink: 0; }
        .alert-banner .close-alert { margin-left: auto; cursor: pointer; background: none; border: none; color: inherit; opacity: 0.6; transition: opacity 0.2s; display: flex; align-items: center; }
        .alert-banner .close-alert:hover { opacity: 1; }
        .alert-banner .close-alert svg { width: 16px; height: 16px; }

        @keyframes slideDown {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .toolbar {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }
        .search-box {
            display: flex;
            align-items: center;
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            padding: 0 12px;
            height: 42px;
            flex: 1;
            min-width: 200px;
            transition: var(--transition);
        }
        .search-box:focus-within { border-color: var(--primary); box-shadow: 0 0 0 3px rgba(61, 122, 95, 0.12); }
        .search-box svg { width: 18px; height: 18px; color: var(--text-muted); flex-shrink: 0; }
        .search-box input { border: none; outline: none; background: transparent; padding: 0 10px; font-size: 0.9rem; font-family: var(--font); color: var(--text); flex: 1; height: 100%; }
        .search-box input::placeholder { color: var(--text-muted); }

        .select-wrapper { position: relative; display: flex; align-items: center; }
        .select-wrapper select { appearance: none; -webkit-appearance: none; background: var(--card); border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 0 32px 0 12px; height: 42px; font-size: 0.85rem; font-family: var(--font); color: var(--text); cursor: pointer; transition: var(--transition); outline: none; min-width: 110px; }
        .select-wrapper select:focus { border-color: var(--primary); box-shadow: 0 0 0 3px rgba(61, 122, 95, 0.12); }
        .select-wrapper svg { position: absolute; right: 10px; width: 14px; height: 14px; color: var(--text-muted); pointer-events: none; }

        .btn-primary {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: var(--primary);
            color: #fff;
            border: none;
            border-radius: var(--radius-sm);
            padding: 0 18px;
            height: 42px;
            font-size: 0.9rem;
            font-weight: 600;
            font-family: var(--font);
            cursor: pointer;
            transition: var(--transition);
            white-space: nowrap;
            letter-spacing: 0.2px;
        }
        .btn-primary:hover { background: var(--primary-dark); transform: translateY(-1px); box-shadow: 0 4px 12px rgba(61, 122, 95, 0.3); }
        .btn-primary:active { transform: translateY(0); box-shadow: none; }
        .btn-primary svg { width: 18px; height: 18px; }

        .view-toggle {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 42px;
            height: 42px;
            border-radius: var(--radius-sm);
            border: 1px solid var(--border);
            background: var(--card);
            cursor: pointer;
            transition: var(--transition);
            color: var(--text-secondary);
        }
        .view-toggle:hover { border-color: var(--primary); color: var(--primary); background: var(--primary-50); }
        .view-toggle.active { border-color: var(--primary); color: var(--primary); background: var(--primary-50); }
        .view-toggle svg { width: 18px; height: 18px; }

        .food-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 16px; }
        .food-card {
            background: var(--card);
            border-radius: var(--radius);
            padding: 20px;
            box-shadow: var(--shadow-sm);
            border: 1px solid var(--border-light);
            transition: var(--transition);
            position: relative;
            animation: fadeInUp 0.35s ease;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .food-card:hover { box-shadow: var(--shadow-md); transform: translateY(-3px); border-color: var(--border); }
        .food-card.consumed { opacity: 0.65; background: #fafafa; }
        .food-card.consumed .food-name { text-decoration: line-through; color: var(--text-muted); }
        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(16px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .card-top { display: flex; align-items: flex-start; justify-content: space-between; gap: 8px; }
        .food-name { font-size: 1.15rem; font-weight: 700; letter-spacing: -0.3px; color: var(--text); word-break: break-word; }
        .card-badges { display: flex; gap: 6px; flex-shrink: 0; flex-wrap: wrap; justify-content: flex-end; }
        .badge { display: inline-flex; align-items: center; gap: 4px; font-size: 0.72rem; font-weight: 600; padding: 3px 9px; border-radius: 20px; letter-spacing: 0.3px; white-space: nowrap; }
        .badge svg { width: 12px; height: 12px; }
        .badge-danger { background: var(--danger-bg); color: var(--danger); border: 1px solid var(--danger-border); }
        .badge-warning { background: var(--warning-bg); color: var(--warning); border: 1px solid var(--warning-border); }
        .badge-caution { background: var(--caution-bg); color: #a16207; border: 1px solid var(--caution-border); }
        .badge-success { background: var(--success-bg); color: var(--success); border: 1px solid var(--success-border); }
        .badge-neutral { background: #f3f4f6; color: var(--text-secondary); border: 1px solid var(--border); }
        .badge-info { background: var(--info-bg); color: var(--info); border: 1px solid var(--info-border); }

        .card-dates { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; font-size: 0.82rem; }
        .date-item { display: flex; align-items: center; gap: 6px; color: var(--text-secondary); }
        .date-item svg { width: 14px; height: 14px; color: var(--text-muted); flex-shrink: 0; }
        .date-item strong { color: var(--text); font-weight: 600; }

        .expiry-info {
            font-size: 0.82rem;
            font-weight: 600;
            padding: 6px 10px;
            border-radius: 6px;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            align-self: flex-start;
        }
        .expiry-info svg { width: 14px; height: 14px; }
        .expiry-danger { background: var(--danger-bg); color: var(--danger); }
        .expiry-warning { background: var(--warning-bg); color: var(--warning); }
        .expiry-caution { background: var(--caution-bg); color: #a16207; }
        .expiry-success { background: var(--success-bg); color: var(--success); }

        .progress-section { display: flex; align-items: center; gap: 10px; }
        .progress-bar-container { flex: 1; height: 8px; background: #e5e7eb; border-radius: 4px; overflow: hidden; cursor: pointer; position: relative; }
        .progress-bar-fill { height: 100%; border-radius: 4px; transition: width 0.5s cubic-bezier(0.4, 0, 0.2, 1); background: var(--primary); }
        .progress-bar-fill.low { background: #9ca3af; }
        .progress-bar-fill.high { background: var(--success); }
        .progress-label { font-size: 0.75rem; font-weight: 600; color: var(--text-secondary); min-width: 32px; text-align: center; }
        .progress-btns { display: flex; gap: 4px; }
        .btn-progress {
            width: 28px;
            height: 28px;
            border-radius: 6px;
            border: 1px solid var(--border);
            background: var(--card);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: var(--transition);
            color: var(--text-secondary);
            font-size: 1rem;
            font-weight: 600;
            font-family: var(--font);
            line-height: 1;
            padding: 0;
        }
        .btn-progress:hover { border-color: var(--primary); color: var(--primary); background: var(--primary-50); }
        .btn-progress:active { transform: scale(0.92); }
        .btn-progress:disabled { opacity: 0.4; cursor: not-allowed; }

        .card-footer { display: flex; align-items: center; justify-content: space-between; gap: 8px; border-top: 1px solid var(--border-light); padding-top: 10px; margin-top: auto; }
        .card-actions { display: flex; gap: 6px; }
        .btn-sm {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            padding: 6px 10px;
            border-radius: 6px;
            border: 1px solid var(--border);
            background: var(--card);
            cursor: pointer;
            font-size: 0.75rem;
            font-weight: 500;
            font-family: var(--font);
            color: var(--text-secondary);
            transition: var(--transition);
            white-space: nowrap;
        }
        .btn-sm:hover { border-color: var(--primary); color: var(--primary); background: var(--primary-50); }
        .btn-sm.danger:hover { border-color: var(--danger); color: var(--danger); background: var(--danger-bg); }
        .btn-sm.success:hover { border-color: var(--success); color: var(--success); background: var(--success-bg); }
        .btn-sm svg { width: 14px; height: 14px; }

        .category-tag { font-size: 0.7rem; color: var(--text-muted); background: #f9fafb; padding: 2px 8px; border-radius: 4px; border: 1px solid var(--border-light); display: inline-flex; align-items: center; gap: 4px; }
        .category-tag svg { width: 11px; height: 11px; }

        .table-view { background: var(--card); border-radius: var(--radius); box-shadow: var(--shadow-sm); border: 1px solid var(--border-light); overflow-x: auto; animation: fadeInUp 0.35s ease; }
        .food-table { width: 100%; border-collapse: collapse; font-size: 0.85rem; min-width: 900px; }
        .food-table thead th { background: #f9fafb; color: var(--text-secondary); font-weight: 600; padding: 12px 14px; text-align: left; border-bottom: 1px solid var(--border); white-space: nowrap; font-size: 0.78rem; letter-spacing: 0.3px; text-transform: uppercase; }
        .food-table tbody td { padding: 10px 14px; border-bottom: 1px solid var(--border-light); vertical-align: middle; white-space: nowrap; }
        .food-table tbody tr:hover { background: var(--primary-50); transition: background 0.2s; }
        .food-table tbody tr.consumed { opacity: 0.6; background: #fafafa; }
        .food-table .table-name { font-weight: 600; color: var(--text); max-width: 160px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .food-table .table-progress { display: flex; align-items: center; gap: 6px; }
        .food-table .progress-bar-container { width: 80px; flex: none; }
        .food-table .progress-label { font-size: 0.7rem; min-width: 28px; }
        .food-table .btn-sm { padding: 4px 7px; font-size: 0.7rem; }
        .food-table .btn-sm svg { width: 12px; height: 12px; }
        .food-table .table-actions { display: flex; gap: 4px; align-items: center; }
        .food-table .table-status { display: inline-flex; align-items: center; gap: 4px; font-size: 0.75rem; font-weight: 600; padding: 2px 8px; border-radius: 12px; white-space: nowrap; }
        .food-table .table-status.danger { background: var(--danger-bg); color: var(--danger); }
        .food-table .table-status.warning { background: var(--warning-bg); color: var(--warning); }
        .food-table .table-status.caution { background: var(--caution-bg); color: #a16207; }
        .food-table .table-status.success { background: var(--success-bg); color: var(--success); }
        .food-table .table-status.neutral { background: #f3f4f6; color: var(--text-secondary); }

        .empty-state { text-align: center; padding: 60px 20px; color: var(--text-muted); }
        .empty-state svg { width: 64px; height: 64px; color: #d1d5db; margin-bottom: 16px; }
        .empty-state h3 { font-size: 1.1rem; font-weight: 600; color: var(--text-secondary); margin-bottom: 6px; }
        .empty-state p { font-size: 0.85rem; }

        .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(0, 0, 0, 0.45); z-index: 200; justify-content: center; align-items: center; padding: 20px; backdrop-filter: blur(4px); animation: fadeIn 0.2s ease; }
        .modal-overlay.show { display: flex; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        .modal {
            background: var(--card);
            border-radius: var(--radius-lg);
            width: 100%;
            max-width: 520px;
            max-height: 90vh;
            overflow-y: auto;
            padding: 28px 28px 24px;
            box-shadow: var(--shadow-lg);
            animation: modalIn 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        @keyframes modalIn { from { opacity: 0; transform: translateY(20px) scale(0.97); } to { opacity: 1; transform: translateY(0) scale(1); } }
        .modal-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 22px; }
        .modal-header h2 { font-size: 1.3rem; font-weight: 700; letter-spacing: -0.3px; display: flex; align-items: center; gap: 8px; }
        .modal-header h2 svg { width: 22px; height: 22px; color: var(--primary); }
        .modal-close { width: 32px; height: 32px; border-radius: 8px; border: none; background: none; cursor: pointer; display: flex; align-items: center; justify-content: center; color: var(--text-muted); transition: var(--transition); }
        .modal-close:hover { background: #f3f4f6; color: var(--text); }
        .modal-close svg { width: 18px; height: 18px; }

        .form-group { margin-bottom: 16px; }
        .form-group label { display: block; font-size: 0.82rem; font-weight: 600; color: var(--text-secondary); margin-bottom: 6px; letter-spacing: 0.2px; }
        .form-group input, .form-group select, .form-group textarea { width: 100%; padding: 10px 12px; border: 1px solid var(--border); border-radius: var(--radius-sm); font-size: 0.9rem; font-family: var(--font); color: var(--text); outline: none; transition: var(--transition); background: var(--card); }
        .form-group input:focus, .form-group select:focus, .form-group textarea:focus { border-color: var(--primary); box-shadow: 0 0 0 3px rgba(61, 122, 95, 0.1); }
        .form-group textarea { resize: vertical; min-height: 60px; }
        .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
        .form-hint { font-size: 0.75rem; color: var(--text-muted); margin-top: 4px; }
        .form-preview { background: var(--primary-50); border-radius: var(--radius-sm); padding: 10px 14px; font-size: 0.85rem; color: var(--primary-dark); display: flex; align-items: center; gap: 8px; margin-bottom: 4px; }
        .form-preview svg { width: 16px; height: 16px; flex-shrink: 0; }

        .modal-footer { display: flex; gap: 10px; margin-top: 22px; justify-content: flex-end; }
        .btn-secondary { display: inline-flex; align-items: center; gap: 6px; padding: 0 16px; height: 40px; border-radius: var(--radius-sm); border: 1px solid var(--border); background: var(--card); font-size: 0.85rem; font-weight: 500; font-family: var(--font); color: var(--text-secondary); cursor: pointer; transition: var(--transition); }
        .btn-secondary:hover { border-color: var(--text-muted); color: var(--text); background: #f9fafb; }
        .btn-submit { display: inline-flex; align-items: center; gap: 6px; padding: 0 20px; height: 40px; border-radius: var(--radius-sm); border: none; background: var(--primary); font-size: 0.85rem; font-weight: 600; font-family: var(--font); color: #fff; cursor: pointer; transition: var(--transition); }
        .btn-submit:hover { background: var(--primary-dark); box-shadow: 0 4px 12px rgba(61, 122, 95, 0.3); }

        .confirm-dialog .modal { max-width: 380px; text-align: center; padding: 28px 24px 20px; }
        .confirm-dialog .icon-wrap { width: 56px; height: 56px; border-radius: 50%; background: var(--danger-bg); color: var(--danger); display: flex; align-items: center; justify-content: center; margin: 0 auto 16px; }
        .confirm-dialog .icon-wrap svg { width: 26px; height: 26px; }
        .confirm-dialog h3 { font-size: 1.1rem; font-weight: 700; margin-bottom: 8px; }
        .confirm-dialog p { font-size: 0.85rem; color: var(--text-secondary); margin-bottom: 20px; }

        .toast-container { position: fixed; bottom: 24px; right: 24px; z-index: 300; display: flex; flex-direction: column; gap: 10px; pointer-events: none; }
        .toast { background: #1f2937; color: #fff; padding: 12px 18px; border-radius: var(--radius-sm); font-size: 0.85rem; font-weight: 500; box-shadow: var(--shadow-lg); animation: toastIn 0.35s ease; display: flex; align-items: center; gap: 8px; pointer-events: auto; max-width: 360px; }
        .toast svg { width: 16px; height: 16px; flex-shrink: 0; }
        .toast.success svg { color: #4ade80; }
        .toast.error svg { color: #f87171; }
        .toast.info svg { color: #60a5fa; }
        @keyframes toastIn { from { opacity: 0; transform: translateX(20px); } to { opacity: 1; transform: translateX(0); } }
        .toast.hide { animation: toastOut 0.3s ease forwards; }
        @keyframes toastOut { to { opacity: 0; transform: translateX(20px); } }

        @media (max-width: 768px) {
            .navbar { padding: 0 16px; height: 56px; }
            .navbar-brand { font-size: 1.05rem; }
            .navbar-brand svg { width: 22px; height: 22px; }

            .stat-icon { width: 36px; height: 36px; border-radius: 8px; }

        }

        }

        };

        const STORAGE_KEY = 'food_manager_data';
        let foods = [];
        let currentFilter = 'all';
        let currentCategory = 'all';
        let currentStatus = 'all';
        let currentSort = 'expiry-asc';
        let searchQuery = '';
        let editingId = null;
        let deletingId = null;
        let alertDismissed = false;
        let currentView = 'card';
        let notifPermission = Notification.permission;
        let lastNotifTime = 0;
        const NOTIF_COOLDOWN = 300000;

        function loadData() {
            try {
                const raw = localStorage.getItem(STORAGE_KEY);
                if (raw) {
                    foods = JSON.parse(raw);
                    if (!Array.isArray(foods)) foods = [];
                }
            } catch (e) {
                console.error('数据加载失败:', e);
                foods = [];
            }
        }

        function saveData() {
            try {
                localStorage.setItem(STORAGE_KEY, JSON.stringify(foods));
            } catch (e) {
                console.error('数据保存失败:', e);
                showToast('数据保存失败，请检查存储空间', 'error');
            }
        }

        function generateId() {
            return Date.now().toString(36) + Math.random().toString(36).substr(2, 6);
        }

        function calculateExpiryDate(productionDate, shelfLifeDays) {
            if (!productionDate || !shelfLifeDays) return null;
            const date = new Date(productionDate + 'T00:00:00');
            date.setDate(date.getDate() + parseInt(shelfLifeDays));
            return date;
        }

        function calculateDaysRemaining(expiryDate) {
            if (!expiryDate) return null;
            const today = new Date();
            today.setHours(0, 0, 0, 0);
            const expiry = new Date(expiryDate);
            expiry.setHours(0, 0, 0, 0);
            const diff = expiry - today;
            return Math.ceil(diff / (1000 * 60 * 60 * 24));
        }

        function getFoodStatus(food) {
            if (food.progress >= 100) return 'consumed';
            const daysRemaining = calculateDaysRemaining(food.expiryDate);
            if (daysRemaining === null) return 'unknown';
            if (daysRemaining < 0) return 'expired';
            if (daysRemaining <= 3) return 'warning';
            if (daysRemaining <= 7) return 'caution';
            return 'fresh';
        }

        function formatDate(dateStr) {
            if (!dateStr) return '—';
            const parts = dateStr.split('-');
            if (parts.length !== 3) return dateStr;
            return `${parts[0]}年${parseInt(parts[1])}月${parseInt(parts[2])}日`;
        }

        function formatShortDate(dateStr) {
            if (!dateStr) return '—';
            const parts = dateStr.split('-');
            if (parts.length !== 3) return dateStr;
            return `${parseInt(parts[1])}/${parseInt(parts[2])}`;
        }

        function getStatusBadge(food) {
            const status = getFoodStatus(food);
            switch (status) {
                case 'consumed': return `<span class="badge badge-neutral">${ICONS.checkCircle} 已吃完</span>`;
                case 'expired': {
                    const days = Math.abs(calculateDaysRemaining(food.expiryDate) || 0);
                    return `<span class="badge badge-danger">${ICONS.xCircle} 已过期${days}天</span>`;
                }
                case 'warning': {
                    const days = calculateDaysRemaining(food.expiryDate);
                    if (days === 0) return `<span class="badge badge-danger">${ICONS.alert} 今天到期</span>`;
                    return `<span class="badge badge-warning">${ICONS.alert} 剩${days}天</span>`;
                }
                case 'caution': {
                    const days = calculateDaysRemaining(food.expiryDate);
                    return `<span class="badge badge-caution">${ICONS.clock} 剩${days}天</span>`;
                }
                default: {
                    const days = calculateDaysRemaining(food.expiryDate);
                    return `<span class="badge badge-success">${ICONS.leaf} 剩余${days}天</span>`;
                }
            }
        }

        function getExpiryClass(food) {
            const status = getFoodStatus(food);
            if (status === 'expired') return 'expiry-danger';
            if (status === 'warning') return 'expiry-warning';
            if (status === 'caution') return 'expiry-caution';
            return 'expiry-success';
        }

        function getExpiryText(food) {
            const status = getFoodStatus(food);
            const days = calculateDaysRemaining(food.expiryDate);
            if (status === 'consumed') return '已吃完';
            if (status === 'expired') return `已过期 ${Math.abs(days)} 天`;
            if (days === 0) return '今天到期！';
            if (status === 'warning') return `还有 ${days} 天到期`;
            if (status === 'caution') return `还有 ${days} 天到期`;
            return `还有 ${days} 天到期`;
        }

        function getExpiryIcon(food) {
            const status = getFoodStatus(food);
            if (status === 'expired') return ICONS.xCircle;
            if (status === 'warning' || status === 'caution') return ICONS.alert;
            return ICONS.checkCircle;
        }

        function updateNotificationButton() {
            const btn = document.getElementById('btnNotification');
            const dot = document.getElementById('notifDot');
            if (notifPermission === 'granted') {
                btn.innerHTML = ICONS.bell;
                btn.title = '通知已开启';
                btn.classList.add('active');
                dot.classList.remove('show');
            } else if (notifPermission === 'denied') {
                btn.innerHTML = ICONS.bellOff;
                btn.title = '通知已被拒绝，请在浏览器设置中允许';
                btn.classList.remove('active');
                dot.classList.remove('show');
            } else {
                btn.innerHTML = ICONS.bell;
                btn.title = '开启通知提醒';
                btn.classList.remove('active');
                const urgent = foods.filter(f => {
                    const s = getFoodStatus(f);
                    return s === 'expired' || s === 'warning' || s === 'caution';
                });
                if (urgent.length > 0) dot.classList.add('show');
                else dot.classList.remove('show');
            }
        }

        async function requestNotificationPermission() {
            if (!('Notification' in window)) {
                showToast('当前浏览器不支持通知', 'error');
                return;
            }
            if (notifPermission === 'granted') {
                showToast('通知已开启', 'info');
                return;
            }
            if (notifPermission === 'denied') {
                showToast('通知已被拒绝，请在浏览器设置中允许', 'error');
                return;
            }
            try {
                const permission = await Notification.requestPermission();
                notifPermission = permission;
                updateNotificationButton();
                if (permission === 'granted') {
                    showToast('通知已开启，到期时会提醒您', 'success');
                    checkAndNotify(true);
                } else {
                    showToast('通知权限被拒绝', 'error');
                }
            } catch (err) {
                console.error('请求通知权限失败:', err);
                showToast('无法请求通知权限', 'error');
            }
        }

        function checkAndNotify(force = false) {
            if (notifPermission !== 'granted') return;
            const now = Date.now();
            if (!force && (now - lastNotifTime) < NOTIF_COOLDOWN) return;
            const urgentFoods = foods.filter(f => {
                const status = getFoodStatus(f);
                return status === 'expired' || status === 'warning' || status === 'caution';
            });
            if (urgentFoods.length === 0) return;
            const sorted = urgentFoods.sort((a, b) => {
                const aDays = calculateDaysRemaining(a.expiryDate);
                const bDays = calculateDaysRemaining(b.expiryDate);
                if (aDays === null) return 1;
                if (bDays === null) return -1;
                return aDays - bDays;
            });
            const expired = sorted.filter(f => getFoodStatus(f) === 'expired');
            const warning = sorted.filter(f => getFoodStatus(f) === 'warning' && calculateDaysRemaining(f.expiryDate) <= 1);
            const caution = sorted.filter(f => getFoodStatus(f) === 'caution' || (getFoodStatus(f) === 'warning' && calculateDaysRemaining(f.expiryDate) > 1));
            let title = '';
            let body = '';
            let tag = '';
            if (expired.length > 0) {
                title = '🚨 食材已过期！';
                body = expired.map(f => `${f.name}（已过期${Math.abs(calculateDaysRemaining(f.expiryDate))}天）`).join('、');
                tag = 'expired';
            } else if (warning.length > 0) {
                title = '⚠️ 食材即将到期！';
                const items = warning.map(f => {
                    const days = calculateDaysRemaining(f.expiryDate);
                    return days === 0 ? `${f.name}（今天到期）` : `${f.name}（剩${days}天）`;
                });
                body = items.join('、');
                tag = 'warning-1day';
            } else if (caution.length > 0) {
                title = '⏰ 食材快到期了';
                body = caution.map(f => `${f.name}（剩${calculateDaysRemaining(f.expiryDate)}天）`).join('、');
                tag = 'caution-3days';
            }
            if (title) {
                try {
                    const notification = new Notification(title, {
                        body: body,
                        icon: 'data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHdpZHRoPSI2NCIgaGVpZ2h0PSI2NCIgdmlld0JveD0iMCAwIDI0IDI0IiBmaWxsPSJub25lIiBzdHJva2U9IiMzZDdhNWYiIHN0cm9rZS13aWR0aD0iMiIgc3Ryb2tlLWxpbmVjYXA9InJvdW5kIiBzdHJva2UtbGluZWpvaW49InJvdW5kIj48cGF0aCBkPSJNNiAyaDEyYTIgMiAwIDAgMSAyIDJ2MTZhMiAyIDAgMCAxLTIgMkg2YTIgMiAwIDAgMS0yLTJWNGEyIDIgMCAwIDEgMi0yeiIvPjxwYXRoIGQ9Ik05IDJ2NGg2VjIiLz48cGF0aCBkPSJNOCAxMWg4TTggMTVoOE04IDE5aDUiLz48L3N2Zz4=',
                        tag: tag,
                        renotify: true,
                    });
                    notification.onclick = () => {
                        window.focus();
                        notification.close();
                    };
                } catch (err) {
                    console.error('弹出通知失败:', err);
                }
                lastNotifTime = now;
            }
        }

        function getFilteredFoods() {
            let filtered = [...foods];
            if (searchQuery.trim()) {
                const q = searchQuery.trim().toLowerCase();
                filtered = filtered.filter(f =>
                    f.name.toLowerCase().includes(q) ||
                    (f.notes && f.notes.toLowerCase().includes(q))
                );
            }
            if (currentCategory !== 'all') {
                filtered = filtered.filter(f => f.category === currentCategory);
            }
            if (currentStatus !== 'all') {
                filtered = filtered.filter(f => {
                    const status = getFoodStatus(f);
                    if (currentStatus === 'active') return status !== 'consumed';
                    if (currentStatus === 'consumed') return status === 'consumed';
                    if (currentStatus === 'fresh') return status === 'fresh';
                    if (currentStatus === 'expiring') return status === 'warning' || status === 'caution';
                    if (currentStatus === 'expired') return status === 'expired';
                    return true;
                });
            }
            filtered.sort((a, b) => {
                switch (currentSort) {
                    case 'expiry-asc': return (a.expiryDate || '9999-12-31').localeCompare(b.expiryDate || '9999-12-31');
                    case 'expiry-desc': return (b.expiryDate || '0000-00-00').localeCompare(a.expiryDate || '0000-00-00');
                    case 'name-asc': return a.name.localeCompare(b.name, 'zh-CN');
                    case 'created-desc': return (b.createdAt || '').localeCompare(a.createdAt || '');
                    case 'progress-desc': return (b.progress || 0) - (a.progress || 0);
                    default: return 0;
                }
            });
            return filtered;
        }

        function renderStats() {
            const total = foods.filter(f => getFoodStatus(f) !== 'consumed').length;
            const fresh = foods.filter(f => getFoodStatus(f) === 'fresh').length;
            const expiring = foods.filter(f => {
                const s = getFoodStatus(f);
                return s === 'warning' || s === 'caution';
            }).length;
            const expired = foods.filter(f => getFoodStatus(f) === 'expired').length;
            document.getElementById('statTotal').textContent = total;
            document.getElementById('statFresh').textContent = fresh;
            document.getElementById('statExpiring').textContent = expiring;
            document.getElementById('statExpired').textContent = expired;
        }

        function renderAlertBanner() {
            const banner = document.getElementById('alertBanner');
            const text = document.getElementById('alertText');
            const urgent = foods.filter(f => {
                const s = getFoodStatus(f);
                return s === 'expired' || s === 'warning';
            });
            const caution = foods.filter(f => getFoodStatus(f) === 'caution');
            if (alertDismissed || (urgent.length === 0 && caution.length === 0)) {
                banner.classList.remove('show');
                banner.className = 'alert-banner';
                return;
            }
            let message = '';
            let type = '';
            if (urgent.length > 0) {
                const names = urgent.map(f => f.name).join('、');
                message = `⚠ 注意：${names} ${urgent.length > 1 ? '等' : ''}已过期或即将到期，请及时处理！`;
                type = urgent.some(f => getFoodStatus(f) === 'expired') ? 'danger' : 'warning';
            } else if (caution.length > 0) {
                const names = caution.map(f => f.name).join('、');
                message = `⏰ 提醒：${names} 将在7天内到期，请尽快食用。`;
                type = 'caution';
            }
            banner.className = `alert-banner ${type} show`;
            text.textContent = message;
        }

            filtered.forEach(food => {
                const status = getFoodStatus(food);
                const progress = food.progress || 0;
                const progressClass = progress >= 100 ? 'high' : progress < 20 ? 'low' : '';
                const statusText = getExpiryText(food);
                const statusClass = status === 'expired' ? 'danger' : status === 'warning' ? 'warning' : status === 'caution' ? 'caution' : status === 'consumed' ? 'neutral' : 'success';

                html += `<tr class="${rowClass}">

                    <td>${escapeHtml(food.category)}</td>
                    <td>${formatShortDate(food.productionDate)}</td>

                    <td><span class="table-status ${statusClass}">${status === 'consumed' ? '已吃完' : escapeHtml(statusText)}</span></td>

                        <div class="progress-btns">

                        ${progress < 100 ? `<button class="btn-sm success" data-action="consume" data-id="${food.id}" title="标记为已吃完">${ICONS.checkCircle}</button>` : ''}
                        <button class="btn-sm" data-action="edit" data-id="${food.id}" title="编辑">${ICONS.edit}</button>
                        <button class="btn-sm danger" data-action="delete" data-id="${food.id}" title="删除">${ICONS.trash}</button>
                    </div></td>
                </tr>`;
            });
            html += '</tbody></table>';
            tableContainer.innerHTML = html;
        }

        function renderFoodViews() {
            const filtered = getFilteredFoods();
            const grid = document.getElementById('foodGrid');
            const table = document.getElementById('foodTable');
            const emptyState = document.getElementById('emptyState');
            if (currentView === 'card') {
                grid.style.display = 'grid';
                table.style.display = 'none';
                renderCardView(filtered);
            } else {
                grid.style.display = 'none';
                table.style.display = 'block';
                renderTableView(filtered);
            }
            if (filtered.length === 0) {
                emptyState.style.display = 'block';
                if (foods.length === 0) {
                    document.getElementById('emptyTitle').textContent = '暂无食材';
                    document.getElementById('emptyDesc').textContent = '点击上方"添加食材"按钮开始记录吧';
                } else {
                    document.getElementById('emptyTitle').textContent = '没有匹配结果';
                    document.getElementById('emptyDesc').textContent = '尝试调整筛选条件或搜索关键词';
                }
            } else {
                emptyState.style.display = 'none';
            }
        }

        function renderAll() {
            renderStats();
            renderAlertBanner();
            renderFoodViews();
            updateNotificationButton();
            checkAndNotify();
        }

        function updateViewButtonIcon() {
            const btn = document.getElementById('btnToggleView');
            if (currentView === 'card') {
                btn.innerHTML = ICONS.list;
                btn.title = '切换到表格视图';
            } else {
                btn.innerHTML = ICONS.grid;
                btn.title = '切换到卡片视图';
            }
        }

        function escapeHtml(str) {
            if (!str) return '';
            const div = document.createElement('div');
            div.textContent = str;
            return div.innerHTML;
        }

        function changeProgress(id, delta) {
            const food = foods.find(f => f.id === id);
            if (!food) return;
            const newProgress = Math.max(0, Math.min(100, (food.progress || 0) + delta));
            food.progress = newProgress;
            food.updatedAt = new Date().toISOString();
            saveData();
            renderAll();
            if (newProgress >= 100) showToast(`「${food.name}」已吃完！`, 'success');
        }

        function setProgress(id, value) {
            const food = foods.find(f => f.id === id);
            if (!food) return;
            food.progress = Math.max(0, Math.min(100, value));
            food.updatedAt = new Date().toISOString();
            saveData();
            renderAll();
            if (food.progress >= 100) showToast(`「${food.name}」已标记为吃完！`, 'success');
        }

        function deleteFood(id) {
            const food = foods.find(f => f.id === id);
            if (!food) return;
            foods = foods.filter(f => f.id !== id);
            saveData();
            renderAll();
            showToast(`已删除「${food.name}」`, 'info');
        }

        function clearConsumedFoods() {
            const consumed = foods.filter(f => getFoodStatus(f) === 'consumed');
            if (consumed.length === 0) {
                showToast('没有已吃完的食材可清除', 'info');
                return;
            }
            foods = foods.filter(f => getFoodStatus(f) !== 'consumed');
            saveData();
            renderAll();
            showToast(`已清除 ${consumed.length} 个已吃完的食材`, 'success');
        }

        function openAddModal() {
            editingId = null;
            document.getElementById('modalTitle').innerHTML = `${ICONS.plus} 添加食材`;
            document.getElementById('foodForm').reset();
            document.getElementById('formId').value = '';
            document.getElementById('formName').value = '';
            document.getElementById('formCategory').value = '蔬菜';
            document.getElementById('formShelfLife').value = '7';
            document.getElementById('formProductionDate').value = new Date().toISOString().split('T')[0];
            document.getElementById('formPurchaseDate').value = new Date().toISOString().split('T')[0];
            document.getElementById('formProgress').value = 0;
            document.getElementById('formNotes').value = '';
            document.getElementById('progressPreview').textContent = '0%';
            updateExpiryPreview();
            document.getElementById('modalOverlay').classList.add('show');
            setTimeout(() => document.getElementById('formName').focus(), 100);
        }

        function openEditModal(id) {
            const food = foods.find(f => f.id === id);
            if (!food) return;
            editingId = id;
            document.getElementById('modalTitle').innerHTML = `${ICONS.edit} 编辑食材`;
            document.getElementById('formId').value = id;
            document.getElementById('formName').value = food.name;
            document.getElementById('formCategory').value = food.category || '其他';
            document.getElementById('formShelfLife').value = food.shelfLifeDays;
            document.getElementById('formProductionDate').value = food.productionDate;
            document.getElementById('formPurchaseDate').value = food.purchaseDate || '';
            document.getElementById('formProgress').value = food.progress || 0;
            document.getElementById('formNotes').value = food.notes || '';
            document.getElementById('progressPreview').textContent = (food.progress || 0) + '%';
            updateExpiryPreview();
            document.getElementById('modalOverlay').classList.add('show');
            setTimeout(() => document.getElementById('formName').focus(), 100);
        }

        function closeModal() {
            document.getElementById('modalOverlay').classList.remove('show');
            editingId = null;
        }

        function updateExpiryPreview() {
            const prodDate = document.getElementById('formProductionDate').value;
            const shelfLife = parseInt(document.getElementById('formShelfLife').value);
            const textEl = document.getElementById('expiryPreviewText');
            if (prodDate && shelfLife && shelfLife > 0) {
                const expiry = calculateExpiryDate(prodDate, shelfLife);
                const daysRemaining = calculateDaysRemaining(expiry);
                let statusText = '';
                let color = 'var(--primary-dark)';
                if (daysRemaining < 0) {
                    statusText = `已过期 ${Math.abs(daysRemaining)} 天`;
                    color = 'var(--danger)';
                } else if (daysRemaining <= 3) {
                    statusText = `还有 ${daysRemaining} 天到期`;
                    color = 'var(--warning)';
                } else if (daysRemaining <= 7) {
                    statusText = `还有 ${daysRemaining} 天到期`;
                    color = 'var(--caution)';
                } else {
                    statusText = `还有 ${daysRemaining} 天到期`;
                    color = 'var(--success)';
                }
                textEl.textContent = `到期日期：${formatDate(expiry.toISOString().split('T')[0])}（${statusText}）`;
                textEl.style.color = color;
            } else {
                textEl.textContent = '请选择生产日期和保质期';
                textEl.style.color = 'var(--text-muted)';
            }
        }

        function handleFormSubmit(e) {
            e.preventDefault();
            const name = document.getElementById('formName').value.trim();
            const category = document.getElementById('formCategory').value;
            const shelfLifeDays = parseInt(document.getElementById('formShelfLife').value);
            const productionDate = document.getElementById('formProductionDate').value;
            const purchaseDate = document.getElementById('formPurchaseDate').value;
            const progress = parseInt(document.getElementById('formProgress').value) || 0;
            const notes = document.getElementById('formNotes').value.trim();

            if (!name) { showToast('请输入菜名/食材名称', 'error'); return; }
            if (!productionDate) { showToast('请选择生产日期', 'error'); return; }
            if (!shelfLifeDays || shelfLifeDays < 1) { showToast('请输入有效的保质期天数', 'error'); return; }

            const expiryDate = calculateExpiryDate(productionDate, shelfLifeDays).toISOString().split('T')[0];

            if (editingId) {
                const food = foods.find(f => f.id === editingId);
                if (food) {
                    food.name = name;
                    food.category = category;
                    food.shelfLifeDays = shelfLifeDays;
                    food.productionDate = productionDate;
                    food.purchaseDate = purchaseDate || null;
                    food.expiryDate = expiryDate;
                    food.progress = progress;
                    food.notes = notes || null;
                    food.updatedAt = new Date().toISOString();
                    saveData();
                    renderAll();
                    showToast(`「${name}」已更新`, 'success');
                }
            } else {
                const newFood = {
                    id: generateId(),
                    name: name,
                    category: category,
                    shelfLifeDays: shelfLifeDays,
                    productionDate: productionDate,
                    purchaseDate: purchaseDate || null,
                    expiryDate: expiryDate,
                    progress: progress,
                    notes: notes || null,
                    createdAt: new Date().toISOString(),
                    updatedAt: new Date().toISOString(),
                };
                foods.push(newFood);
                saveData();
                renderAll();
                showToast(`「${name}」已添加`, 'success');
                alertDismissed = false;
            }
            closeModal();
            if (notifPermission === 'granted') {
                checkAndNotify(true);
            }
        }

        function openDeleteConfirm(id) {
            deletingId = id;
            const food = foods.find(f => f.id === id);
            if (!food) return;
            document.getElementById('confirmTitle').textContent = '确认删除';
            document.getElementById('confirmText').textContent = `确定要删除「${food.name}」吗？此操作不可撤销。`;
            document.getElementById('confirmOverlay').classList.add('show');
        }

        function closeConfirm() {
            document.getElementById('confirmOverlay').classList.remove('show');
            deletingId = null;
        }

        function showToast(message, type = 'info') {
            const container = document.getElementById('toastContainer');
            const toast = document.createElement('div');
            toast.className = `toast ${type}`;
            const icon = type === 'success' ? ICONS.checkCircle : type === 'error' ? ICONS.xCircle : ICONS.info;
            toast.innerHTML = `${icon} ${escapeHtml(message)}`;
            container.appendChild(toast);
            setTimeout(() => {
                toast.classList.add('hide');
                setTimeout(() => toast.remove(), 300);
            }, 2800);
        }

        function exportData() {
            if (foods.length === 0) { showToast('没有数据可导出', 'info'); return; }
            const dataStr = JSON.stringify(foods, null, 2);
            const blob = new Blob([dataStr], { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `食材管家数据_${new Date().toISOString().split('T')[0]}.json`;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
            showToast('数据已导出', 'success');
        }

        function importData(file) {
            const reader = new FileReader();
            reader.onload = (e) => {
                try {
                    const data = JSON.parse(e.target.result);
                    if (!Array.isArray(data)) throw new Error('格式错误');
                    const validItems = data.filter(item => item.id && item.name && item.productionDate && item.expiryDate && item.shelfLifeDays);
                    if (validItems.length === 0) {
                        showToast('导入失败：没有有效的数据', 'error');
                        return;
                    }
                    const existingIds = new Set(foods.map(f => f.id));
                    let addedCount = 0;
                    validItems.forEach(item => {
                        if (!existingIds.has(item.id)) {
                            foods.push(item);
                            existingIds.add(item.id);
                            addedCount++;
                        }
                    });
                    saveData();
                    renderAll();
                    showToast(`成功导入 ${addedCount} 条数据`, 'success');
                } catch (err) {
                    showToast('导入失败：文件格式不正确', 'error');
                }
            };
            reader.readAsText(file);
        }

        function initEvents() {
            document.getElementById('btnAdd').addEventListener('click', openAddModal);
            document.getElementById('modalClose').addEventListener('click', closeModal);
            document.getElementById('btnCancel').addEventListener('click', closeModal);
            document.getElementById('modalOverlay').addEventListener('click', (e) => {
                if (e.target === document.getElementById('modalOverlay')) closeModal();
            });
            document.getElementById('foodForm').addEventListener('submit', handleFormSubmit);
            document.getElementById('formProductionDate').addEventListener('change', updateExpiryPreview);
            document.getElementById('formShelfLife').addEventListener('input', updateExpiryPreview);
            document.getElementById('formProgress').addEventListener('input', (e) => {
                document.getElementById('progressPreview').textContent = e.target.value + '%';
            });

            document.getElementById('searchInput').addEventListener('input', (e) => {
                searchQuery = e.target.value;
                renderFoodViews();
            });
            document.getElementById('categoryFilter').addEventListener('change', (e) => {
                currentCategory = e.target.value;
                renderFoodViews();
            });
            document.getElementById('statusFilter').addEventListener('change', (e) => {
                currentStatus = e.target.value;
                renderFoodViews();
            });
            document.getElementById('sortFilter').addEventListener('change', (e) => {
                currentSort = e.target.value;
                renderFoodViews();
            });

            document.querySelectorAll('.stat-card').forEach(card => {
                card.addEventListener('click', () => {
                    const filter = card.dataset.filter;
                    if (filter === 'all') currentStatus = 'all';
                    else if (filter === 'fresh') currentStatus = 'fresh';
                    else if (filter === 'expiring') currentStatus = 'expiring';
                    else if (filter === 'expired') currentStatus = 'expired';
                    document.getElementById('statusFilter').value = currentStatus;
                    renderFoodViews();
                    document.querySelectorAll('.stat-card').forEach(c => c.style.borderColor = 'var(--border-light)');
                    card.style.borderColor = 'var(--primary)';
                });
            });

            document.getElementById('closeAlert').addEventListener('click', () => {
                alertDismissed = true;
                renderAlertBanner();
            });

            document.getElementById('btnConfirmCancel').addEventListener('click', closeConfirm);
            document.getElementById('btnConfirmOk').addEventListener('click', () => {
                if (deletingId) deleteFood(deletingId);
                closeConfirm();
            });
            document.getElementById('confirmOverlay').addEventListener('click', (e) => {
                if (e.target === document.getElementById('confirmOverlay')) closeConfirm();
            });

            document.getElementById('btnExport').addEventListener('click', exportData);
            document.getElementById('btnImport').addEventListener('click', () => {
                document.getElementById('fileInput').click();
            });
            document.getElementById('fileInput').addEventListener('change', (e) => {
                if (e.target.files.length > 0) {
                    importData(e.target.files[0]);
                    e.target.value = '';
                }
            });

            document.getElementById('btnClearConsumed').addEventListener('click', clearConsumedFoods);
            document.getElementById('btnToggleView').addEventListener('click', () => {
                currentView = currentView === 'card' ? 'table' : 'card';
                updateViewButtonIcon();
                renderAll();
            });
            document.getElementById('btnNotification').addEventListener('click', requestNotificationPermission);
            document.getElementById('btnTestNotif').addEventListener('click', testNotification);

            ['foodGrid', 'foodTable'].forEach(containerId => {
                document.getElementById(containerId).addEventListener('click', (e) => {
                    const target = e.target.closest('[data-action]');
                    if (target) {
                        e.preventDefault();
                        const id = target.dataset.id;
                        const action = target.dataset.action;
                        if (action === 'edit') openEditModal(id);
                        else if (action === 'delete') openDeleteConfirm(id);
                        else if (action === 'consume') setProgress(id, 100);
                        else if (action === 'progress-plus') changeProgress(id, 5);
                        else if (action === 'progress-minus') changeProgress(id, -5);
                        return;
                    }
                    const progressBar = e.target.closest('.progress-bar-container');
                    if (progressBar) {
                        const id = progressBar.dataset.id;
                        const rect = progressBar.getBoundingClientRect();
                        const pct = Math.round(((e.clientX - rect.left) / rect.width) * 100);
                        setProgress(id, Math.max(0, Math.min(100, pct)));
                    }
                });
            });

            document.addEventListener('keydown', (e) => {
                if (e.key === 'Escape') {
                    if (document.getElementById('modalOverlay').classList.contains('show')) closeModal();
                    if (document.getElementById('confirmOverlay').classList.contains('show')) closeConfirm();
                }
                if ((e.ctrlKey || e.metaKey) && e.key === 'k') {
                    e.preventDefault();
                    document.getElementById('searchInput').focus();
                }
                if ((e.ctrlKey || e.metaKey) && e.key === 'n') {
                    e.preventDefault();
                    openAddModal();
                }
            });
        }

        function init() {
            loadData();
            foods.forEach(food => {
                if (!food.expiryDate && food.productionDate && food.shelfLifeDays) {
                    food.expiryDate = calculateExpiryDate(food.productionDate, food.shelfLifeDays).toISOString().split('T')[0];
                }
                if (!food.progress) food.progress = 0;
                if (!food.category) food.category = '其他';
            });
            saveData();
            notifPermission = Notification.permission;
            initEvents();
            renderAll();
            const today = new Date().toISOString().split('T')[0];
            document.getElementById('formProductionDate').value = today;
            document.getElementById('formPurchaseDate').value = today;
            if (notifPermission === 'granted') {
                setTimeout(() => checkAndNotify(true), 3000);
            }
        }

        init();
    </script>
</body>
</html>
